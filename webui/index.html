<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Agent Lab 控制台</title>
    <link rel="stylesheet" href="./style.css?v=20260608-diagnostics" />
  </head>
  <body>
    <div id="auth" class="auth-screen" hidden>
      <form id="auth-form" class="auth-card">
        <div class="mark"><img alt="" id="auth-icon" /></div>
        <h1>Agent Lab</h1>
        <p>输入 AstrBot 插件管理里配置的访问密码后继续。</p>
        <label>
          <span>访问密码</span>
          <input id="token-input" type="password" autocomplete="current-password" placeholder="对应 standalone_webui_token" />
        </label>
        <p id="auth-status" class="auth-status">如果没有设置访问密码，控制台会自动进入。</p>
        <button class="button primary" type="submit">进入控制台</button>
      </form>
    </div>

    <div id="app" class="app-shell" hidden>
      <aside class="side" id="side">
        <div class="brand">
          <img alt="" id="brand-icon" />
          <div>
            <strong>Agent Lab</strong>
            <span>AstrBot 工作流控制台</span>
          </div>
        </div>
        <nav id="nav" class="nav"></nav>
        <div class="identity-box">
          <span>当前身份</span>
          <strong id="identity-name">读取中</strong>
          <small id="identity-source">运行时</small>
        </div>
      </aside>

      <main class="main" id="main">
        <header class="top" id="topbar">
          <button id="collapse-nav" class="icon-btn" type="button" title="收起侧栏"></button>
          <div class="top-title">
            <strong id="page-title">总览</strong>
            <span id="page-subtitle">正在连接 Agent Lab</span>
          </div>
          <div class="top-actions">
            <select id="agent-select" title="选择任务配置"></select>
            <button id="refresh" class="icon-btn" type="button" title="刷新"></button>
          </div>
        </header>

        <section id="view" class="view"></section>
      </main>
    </div>

    <div id="toast-host" class="toast-host"></div>
    <script type="module" src="./app.js?v=20260608-diagnostics"></script>
  </body>
</html>
