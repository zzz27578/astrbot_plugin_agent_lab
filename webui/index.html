<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Agent Lab 控制台</title>
    <link rel="stylesheet" href="./style.css?v=20260605-workflow-canvas-polish" />
  </head>
  <body>
    <!-- Token 验证页面（未验证时显示） -->
    <div id="auth-screen" class="auth-screen" style="display:none;">
      <div class="auth-card">
        <div class="auth-icon">🔐</div>
        <h1>Agent Lab 控制台</h1>
        <p class="auth-hint">请输入访问 Token</p>
        <div class="auth-form">
          <input id="auth-token-input" type="password" class="auth-input" placeholder="Token" autocomplete="off" />
          <button id="auth-submit-btn" type="button" class="auth-button">进入控制台</button>
        </div>
        <p class="auth-note">
          💡 Token 在插件配置中设置<br/>
          键: <code>standalone_webui_token</code>
        </p>
      </div>
    </div>

    <div class="shell" id="main-app" style="display:none;">
      <!-- 全局状态栏 -->
      <div id="global-status-bar" class="global-status-bar">
        <div class="status-left">
          <span class="status-agent">
            <strong id="current-agent-name">加载中...</strong>
            <button id="agent-switcher" class="agent-switcher-btn" title="切换 Agent">▼</button>
          </span>
          <span class="status-indicator">
            <span id="status-dot" class="status-dot idle"></span>
            <span id="status-text">空闲</span>
          </span>
          <span class="status-task" id="status-task" style="display:none;">
            任务: <code id="current-task-id">-</code> |
            已运行: <span id="task-runtime">0s</span>
          </span>
        </div>
        <div class="status-right">
          <span class="status-token">
            <span class="status-token-label">Token:</span>
            <span id="token-current">0</span> / <span id="token-limit">240K</span>
            <div class="token-progress-bar">
              <div id="token-progress-fill" class="token-progress-fill" style="width: 0%"></div>
            </div>
          </span>
          <span class="status-actions">
            <button id="status-pause-btn" class="status-action-btn" style="display:none;" title="暂停任务">暂停</button>
            <button id="status-view-btn" class="status-action-btn" style="display:none;" title="查看任务详情">查看</button>
          </span>
          <button id="refresh" type="button" class="status-refresh-btn" title="刷新数据">🔄</button>
        </div>
      </div>

      <aside class="rail">
        <div class="brand">
          <strong>Agent Lab</strong>
          <span>AstrBot 任务模式框架</span>
        </div>
        <nav id="nav" class="nav"></nav>
        <div class="rail-note">
          <span>运行时身份来源</span>
          <strong id="bot-label">等待读取</strong>
          <small id="bot-source">等待运行时读取</small>
        </div>
      </aside>

      <main class="main">
        <div id="feedback" class="feedback">正在连接 Agent Lab...</div>
        <section id="view" class="view"></section>
      </main>
    </div>

    <script type="module" src="./app.js?v=20260605-workflow-canvas-polish"></script>
  </body>
</html>
