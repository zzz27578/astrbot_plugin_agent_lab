<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>任务模式控制台</title>
    <link rel="stylesheet" href="./style.css?v=20260607-clean-workflow-ui" />
  </head>
  <body>
    <div class="shell" id="main-app">
      <!-- 全局状态栏 -->
      <div id="global-status-bar" class="global-status-bar">
        <div class="status-left">
          <span class="status-agent">
            <strong id="current-agent-name">加载中...</strong>
            <button id="agent-switcher" class="agent-switcher-btn" title="切换方案">▼</button>
          </span>
          <span class="status-indicator">
            <span id="status-dot" class="status-dot idle"></span>
            <span id="status-text">空闲</span>
          </span>
          <span class="status-task" id="status-task" style="display:none;">
            任务: <code id="current-task-id">-</code> |
            已运行: <span id="task-runtime">0s</span>
          </span>
        </div>
        <div class="status-right">
          <span class="status-actions">
            <button id="status-pause-btn" class="status-action-btn" style="display:none;" title="打开任务控制台">控制台</button>
            <button id="status-view-btn" class="status-action-btn" style="display:none;" title="查看任务详情">查看</button>
          </span>
          <button id="refresh" type="button" class="status-refresh-btn icon-button" title="刷新数据" aria-label="刷新数据"></button>
          <button id="settings-btn" type="button" class="status-refresh-btn settings-gear" title="设置">⚙</button>
        </div>
      </div>

      <aside class="rail">
        <div class="brand">
          <strong>任务模式</strong>
          <span>AstrBot 任务模式框架</span>
        </div>
        <nav id="nav" class="nav"></nav>
        <div class="rail-note">
          <span>运行时身份来源</span>
          <strong id="bot-label">等待读取</strong>
          <small id="bot-source">等待运行时读取</small>
        </div>
      </aside>

      <main class="main">
        <div id="feedback" class="feedback">正在连接 Agent Lab...</div>
        <section id="view" class="view"></section>
      </main>
    </div>

    <script type="module" src="./app.js?v=20260607-clean-workflow-ui"></script>
  </body>
</html>
