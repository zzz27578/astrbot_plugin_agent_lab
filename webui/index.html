<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Agent Lab 控制台</title>
    <link rel="stylesheet" href="./style.css?v=20260605-workflow-canvas-polish" />
  </head>
  <body>
    <div class="shell">
      <aside class="rail">
        <div class="brand">
          <strong>Agent Lab</strong>
          <span>AstrBot 任务模式框架</span>
        </div>
        <nav id="nav" class="nav"></nav>
        <div class="rail-note">
          <span>运行时身份来源</span>
          <strong id="bot-label">等待读取</strong>
          <small id="bot-source">等待运行时读取</small>
        </div>
      </aside>

      <main class="main">
        <header class="topbar">
          <div>
            <p id="section-kicker" class="kicker">总览</p>
            <h1 id="section-title">仪表盘</h1>
          </div>
          <div class="top-actions">
            <input id="token" class="token-input" autocomplete="off" placeholder="访问 Token" />
            <button id="save-token" type="button" class="button secondary">保存 Token</button>
            <button id="refresh" type="button" class="button">刷新</button>
          </div>
        </header>

        <div id="feedback" class="feedback">正在连接 Agent Lab...</div>
        <section id="view" class="view"></section>
      </main>
    </div>

    <script type="module" src="./app.js?v=20260605-workflow-canvas-polish"></script>
  </body>
</html>
