<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Agent Lab 控制台</title>
    <link rel="stylesheet" href="./style.css?v=20260607-clean-workflow-ui" />
  </head>
  <body>
    <!-- 访问密码验证（未验证时显示） -->
    <div id="auth-screen" class="auth-screen" style="display:none;">
      <div class="auth-card">
        <h1>Agent Lab 控制台</h1>
        <p class="auth-hint">输入访问密码后进入控制台</p>
        <div class="auth-form">
          <input id="auth-token-input" type="password" class="auth-input" placeholder="访问密码" autocomplete="current-password" />
          <button id="auth-submit-btn" type="button" class="auth-button">进入控制台</button>
        </div>
        <p class="auth-note">
          访问密码由插件配置项 <code>standalone_webui_token</code> 提供。
        </p>
      </div>
    </div>

    <div class="shell" id="main-app" style="display:none;">
      <!-- 全局状态栏 -->
      <div id="global-status-bar" class="global-status-bar">
        <div class="status-left">
          <span class="status-agent">
            <strong id="current-agent-name">加载中...</strong>
            <button id="agent-switcher" class="agent-switcher-btn" title="切换 Agent">▼</button>
          </span>
          <span class="status-indicator">
            <span id="status-dot" class="status-dot idle"></span>
            <span id="status-text">空闲</span>
          </span>
          <span class="status-task" id="status-task" style="display:none;">
            任务: <code id="current-task-id">-</code> |
            已运行: <span id="task-runtime">0s</span>
          </span>
        </div>
        <div class="status-right">
          <span class="status-actions">
            <button id="status-pause-btn" class="status-action-btn" style="display:none;" title="打开任务控制台">控制台</button>
            <button id="status-view-btn" class="status-action-btn" style="display:none;" title="查看任务详情">查看</button>
          </span>
          <button id="refresh" type="button" class="status-refresh-btn icon-button" title="刷新数据" aria-label="刷新数据"></button>
          <button id="settings-btn" type="button" class="status-r
