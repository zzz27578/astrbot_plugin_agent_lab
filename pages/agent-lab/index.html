<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="agent-lab-api-base" content="/api" />
    <title>Agent Lab · 隔离长任务控制台</title>
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='6' fill='%2325272a'/><path d='M9 22V10h14v12H9zm3-9h8m-8 3h8m-8 3h5' stroke='%23ffffff' stroke-width='1.8' fill='none' stroke-linecap='round'/></svg>"
    />
    <link rel="stylesheet" href="./classic.css?v=1.0.1" />
  </head>
  <body>
    <div class="shell" id="main-app">
      <!-- 顶部全局状态栏 (52px) -->
      <header id="global-status-bar" class="global-status-bar">
        <div class="status-left">
          <button
            id="mobile-nav-toggle"
            type="button"
            class="mobile-nav-btn"
            aria-label="展开侧边栏"
            title="菜单"
          >
            <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round">
              <path d="M2.5 4h11M2.5 8h11M2.5 12h11" />
            </svg>
          </button>

          <div class="status-agent-wrap">
            <button
              id="agent-switcher-btn"
              type="button"
              class="status-agent"
              aria-expanded="false"
              aria-haspopup="true"
              title="切换默认机器人身份"
            >
              <span class="identity-indicator" aria-hidden="true"></span>
              <strong id="current-agent-name">加载中...</strong>
              <code id="identity-instance"></code>
              <svg class="status-chevron" width="12" height="12" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="m4 6 4 4 4-4" />
              </svg>
            </button>
            <div id="bot-switcher-popover" class="bot-switcher-popover" hidden></div>
          </div>

          <div class="status-active-quiet" id="status-active-bar">
            <span id="status-dot" class="status-dot idle" aria-hidden="true"></span>
            <span id="status-text">空闲</span>
            <span id="status-task" class="status-task" hidden>
              <span class="status-sep">·</span>
              <code id="current-task-id">-</code>
              <span class="status-sep">·</span>
              <span id="task-runtime">0s</span>
            </span>
          </div>
        </div>

        <div class="status-right">
          <button id="status-view-btn" type="button" class="cl-btn cl-btn-sm" hidden title="跳转到当前活跃任务">
            查看任务
          </button>

          <button id="refresh-btn" type="button" class="status-icon-btn" title="立即刷新数据" aria-label="立即刷新数据">
            <svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
              <path d="M13.5 8a5.5 5.5 0 1 1-1.35-3.61" />
              <path d="M13.5 2.5v2.75h-2.75" />
            </svg>
          </button>

          <button id="settings-btn" type="button" class="status-icon-btn" title="系统设置" aria-label="系统设置">
            <svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="8" cy="8" r="2.2" />
              <path d="M8 1.8v1.4M8 12.8v1.4M2.9 4.5l1.2.7M11.9 10.8l1.2.7M1.8 8h1.4M12.8 8h1.4M2.9 11.5l1.2-.7M11.9 5.2l1.2-.7" />
            </svg>
          </button>
        </div>
      </header>

      <!-- 左侧导航与项目任务树 (232px) -->
      <aside class="rail" id="app-rail">
        <div class="brand">
          <div class="brand-title-row">
            <strong>Agent Lab</strong>
            <span class="brand-version">v1.0.1</span>
          </div>
          <span class="brand-sub">隔离长任务控制台</span>
        </div>

        <nav id="nav" class="nav" aria-label="主导航"></nav>

        <div id="project-sidebar" class="project-sidebar"></div>

        <div id="rail-storage" class="rail-bottom"></div>
      </aside>

      <div id="mobile-rail-backdrop" class="mobile-rail-backdrop" hidden></div>

      <!-- 主工作区 -->
      <main class="main" id="main-scroll">
        <div id="feedback" class="feedback" hidden></div>
        <section id="view" class="view"></section>
      </main>
    </div>

    <div id="modal-root"></div>
    <div id="toast-root" aria-live="polite"></div>

    <script type="module">
      import { store } from "./store.js?v=1.0.1";
      import { mountClassicView } from "./classic-view.js?v=1.0.1";

      mountClassicView(store);
      store.init();
    </script>
  </body>
</html>
